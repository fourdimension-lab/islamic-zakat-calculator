<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061711"/>
      <stop offset="100%" stop-color="#0f2e22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
  <!-- Scale Beam & Pillar (Mizan) -->
  <line x1="32" y1="12" x2="32" y2="48" stroke="url(#gold)" stroke-width="3"/>
  <polygon points="26,50 38,50 35,46 29,46" fill="url(#gold)"/>
  <line x1="16" y1="20" x2="48" y2="20" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Pan -->
  <line x1="16" y1="20" x2="11" y2="34" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="16" y1="20" x2="21" y2="34" stroke="url(#gold)" stroke-width="1.2"/>
  <path d="M 9 34 Q 16 41 23 34 Z" fill="url(#gold)"/>
  <!-- Right Pan -->
  <line x1="48" y1="20" x2="43" y2="34" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="48" y1="20" x2="53" y2="34" stroke="url(#gold)" stroke-width="1.2"/>
  <path d="M 41 34 Q 48 41 55 34 Z" fill="url(#gold)"/>
  <!-- Gold Coins on Pans -->
  <circle cx="16" cy="31" r="3" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>
  <circle cx="48" cy="31" r="3" fill="#fde047" stroke="#b45309" stroke-width="0.8"/>
  <!-- Top Finial -->
  <circle cx="32" cy="12" r="3" fill="url(#gold)"/>
</svg>